# Publish book releases (managed by the template).
#
#   git tag <slug>-v<version> && git push origin <slug>-v<version>   one book; <version> must equal
#                                                                     books/<slug>/book.toml [book].version
#   git tag v<anything> && git push origin v<anything>                every book (not in the template
#                                                                     repository, where v* tags are template
#                                                                     releases: see template-release.yml),
#                                                                     e.g. v2026.11.08, v2026-11-08 or v3.0.0
#
# A release is marked as a GitHub pre-release only when its version is a semantic-version pre-release:
# the book.toml version of a one-book tag (1.0.0-rc.1), or the part after "v" of an all-books tag
# (v3.0.0-rc.1). Any other form, dates with "-" included, makes an ordinary release.
#
# The release carries, per book, the PDFs (screen + print), the EPUB of every edition and the slide PDFs
# (<slug>-<deck>-<lang>.pdf); its notes list each book's version, editions, theorem count and the pinned
# trureturing commit. Film tags (film-*) are handled by film.yml.
#
# Optional: set the repository variable REQUIRE_LEAN_VERIFY=true to run the Lean deep verification
# (lean-verify.yml: axiom closure of every cited declaration) before anything is published.
name: Release

on:
  push:
    tags:
      - '*-v*'
      - 'v*'
      - '!film-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    name: Resolve the books to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      books: ${{ steps.plan.outputs.books }}
      title: ${{ steps.plan.outputs.title }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve the tag
        id: plan
        env:
          TAG: ${{ github.ref_name }}
          TEMPLATE_REPO: ${{ github.repository == 'the-omega-institute/trureturing-books-template' }}
          PYTHONPATH: tools
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          from tbook import config

          tag = os.environ["TAG"]
          books = config.load_books()
          by_slug = {b.slug: b for b in books}
          out = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")

          def emit(key, value):
              out.write(f"{key}={value}\n")

          def fail(msg):
              print(f"::error title=Release::{msg}")
              sys.exit(1)

          def is_prerelease(version):
              """Only a semantic-version pre-release (1.0.0-rc.1); v2026-11-08 is an ordinary release."""
              return re.fullmatch(r"\d+\.\d+\.\d+-[0-9A-Za-z.-]+(?:\+[0-9A-Za-z.-]+)?", version) is not None

          # <slug>-v<version>: the longest known slug wins (slugs may themselves contain "-v").
          slug = max((s for s in by_slug if tag.startswith(s + "-v")), key=len, default=None)
          if slug:
              book = by_slug[slug]
              version = tag[len(slug) + 2:]
              if version != book.version:
                  fail(f"tag {tag} says version {version}, but books/{slug}/book.toml has version "
                       f"{book.version}. Update book.toml (or delete the tag) and tag again.")
              selected = [book]
              title = f"{book.primary.title} {book.version}"
              prerelease = is_prerelease(book.version)
          elif tag.startswith("v"):
              if os.environ["TEMPLATE_REPO"] == "true":
                  print(f"::notice title=Release::{tag} is a template release in the template repository; "
                        "template-release.yml publishes it.")
                  emit("skip", "true")
                  sys.exit(0)
              if not books:
                  fail("there are no books (books/<slug>/book.toml) to release")
              selected = books
              site = config.load_site()
              title = f"{site.text(site.title, site.default_language)} {tag}"
              prerelease = is_prerelease(tag[1:])
          else:
              known = ", ".join(sorted(by_slug)) or "none"
              fail(f"tag {tag} names no book (expected <slug>-v<version> or v<version>; books: {known})")
          emit("skip", "false")
          emit("books", " ".join(b.slug for b in selected))
          emit("title", title.replace("\n", " "))
          emit("prerelease", "true" if prerelease else "false")
          print(f"release {tag}: {', '.join(b.slug for b in selected)}")
          PY

  lean-verify:
    name: Lean deep verification
    needs: plan
    if: needs.plan.outputs.skip != 'true' && vars.REQUIRE_LEAN_VERIFY == 'true'
    uses: ./.github/workflows/lean-verify.yml

  build:
    name: Build PDF, EPUB and slides
    needs: [plan, lean-verify]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true' &&
      (needs.lean-verify.result == 'success' || needs.lean-verify.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          browsers: 'true'
          fonts: 'true'
          mdbook: 'false'

      - name: Cache trureturing frozen state
        uses: actions/cache@v5
        with:
          path: .cache/trureturing
          key: trureturing-state-${{ hashFiles('trureturing.lock.json') }}
          restore-keys: trureturing-state-

      - name: Check
        env:
          # check asks GitHub's compare API whether the pinned trureturing commit is on the site.toml branch
          # (no trureturing checkout here); in GitHub Actions an unanswered question is an error.
          GITHUB_TOKEN: ${{ github.token }}
          # Optional repository secret for a private trureturing (raw files and the compare API).
          TRURETURING_TOKEN: ${{ secrets.TRURETURING_TOKEN }}
        run: ./tbook check

      - name: Build
        env:
          BOOKS: ${{ needs.plan.outputs.books }}
        run: |
          args=()
          for slug in $BOOKS; do args+=(--book "$slug"); done
          ./tbook build pdf epub slides "${args[@]}"

      - name: Collect assets and write the release notes
        env:
          BOOKS: ${{ needs.plan.outputs.books }}
          TAG: ${{ github.ref_name }}
          LEAN_VERIFY: ${{ needs.lean-verify.result }}
          PYTHONPATH: tools
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          from tbook import build, config, lean, model

          # Release-note strings not in theme/i18n (zh / en).
          LOCAL = {
              "zh": {"editions": "语言版本", "theorems": "经 Lean 内核验证的定理",
                     "deep": "Lean 深度验证（公理闭包）已通过", "assets": "附件"},
              "en": {"editions": "Editions", "theorems": "Lean-verified theorems",
                     "deep": "Lean deep verification (axiom closure) passed", "assets": "Assets"},
          }

          site = config.load_site()
          langs = site.languages

          def both(fn):
              """One label per site language: '版本 · Version'."""
              seen = []
              for lang in langs:
                  text = fn(lang)
                  if text and text not in seen:
                      seen.append(text)
              return " · ".join(seen)

          def loc(lang, key):
              return LOCAL.get(lang, LOCAL["en"])[key]

          out = Path("release")
          assets = out / "assets"
          assets.mkdir(parents=True)
          lock = lean.Lock.load()
          notes = []
          missing = []
          for book in config.load_books(os.environ["BOOKS"].split()):
              titles = both(lambda l: book.edition(l).title if l in book.languages else "")
              notes += [f"## {titles or book.primary.title}", ""]
              if book.primary.subtitle:
                  notes += [f"*{book.primary.subtitle}*", ""]
              primary = model.load_edition(book.primary)
              n = len(primary.formal_envs())
              notes.append(f"- {both(lambda l: config.s(l, 'ui.version'))}: `{book.version}`")
              notes.append(f"- {both(lambda l: loc(l, 'editions'))}: "
                           + ", ".join(config.s(lang, "meta.name") or lang for lang in book.languages))
              notes.append(f"- {both(lambda l: loc(l, 'theorems'))}: {n}")
              url = site.book_url(book.slug)
              if url:
                  notes.append(f"- {both(lambda l: config.s(l, 'ui.read_online'))}: {url}/")
              notes.append(f"- {both(lambda l: loc(l, 'assets'))}:")
              for ed in book.editions:
                  lang = ed.lang
                  files = []
                  for variant in book.outputs_pdf:
                      files.append((config.s(lang, f"ui.pdf_{variant}"), book.artifact(lang, "pdf", variant)))
                  if book.outputs_epub:
                      files.append((config.s(lang, "ui.epub"), book.artifact(lang, "epub")))
                  row = []
                  for label, name in files:
                      src = build.dist_dir(book.slug) / name
                      if src.is_file():
                          shutil.copy2(src, assets / name)
                          row.append(f"{label} `{name}`")
                      else:
                          missing.append(name)
                  slides = build.slides_dir(book.slug)
                  for pdf in sorted(slides.glob(f"*-{lang}.pdf")) if slides.is_dir() else []:
                      name = f"{book.slug}-{pdf.name}"  # = tbook.slides.pdf_name(book, deck, lang)
                      shutil.copy2(pdf, assets / name)
                      row.append(f"{config.s(lang, 'ui.slides')} `{name}`")
                  if row:
                      notes.append(f"  - {config.s(lang, 'meta.name') or lang}: " + ", ".join(row))
              notes.append("")
          if lock:
              notes += ["---", "",
                        f"{both(lambda l: config.s(l, 'ui.pinned_at'))}: [`{lock.commit[:12]}`]({lock.tree_url}) "
                        f"· `{lock.repo}` · {lock.branch} · {lock.pinned_at}"]
          if os.environ.get("LEAN_VERIFY") == "success":
              notes += ["", f"✓ {both(lambda l: loc(l, 'deep'))}"]
          (out / "notes.md").write_text("\n".join(notes).rstrip() + "\n", encoding="utf-8")
          print((out / "notes.md").read_text(encoding="utf-8"))
          if missing:
              print(f"::error title=Release::missing build outputs: {', '.join(missing)}")
              sys.exit(1)
          if not any(assets.iterdir()):
              print("::error title=Release::no files to release")
              sys.exit(1)
          PY

      - name: Upload the release files
        uses: actions/upload-artifact@v6
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create the GitHub release
    needs: [plan, build]
    if: >-
      !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ needs.plan.outputs.title }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release/assets -maxdepth 1 -type f | sort)
          printf 'asset: %s\n' "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release/notes.md
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file release/notes.md \
              "${flags[@]}" "${files[@]}"
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
