name: Mathesis paper consistency
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check paper, citation, frozen files and bilingual book mapping
        run: |
          if [ ! -f paper.json ] && [ "$GITHUB_REPOSITORY" = mathesis-papers/paper-template ]; then
            ./tbook template manifest --layer mathesis --check
            echo 'Layer source: publisher has not selected a paper.'
            exit 0
          fi
          python3 docs/layer-mathesis/scripts/paper.py check
          ./tbook check
