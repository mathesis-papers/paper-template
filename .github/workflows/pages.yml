# Build every book (HTML, PDF, EPUB, visualizations, films pages, slides) and deploy _site/ to
# GitHub Pages (managed by the template).
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then the probe job warns and the site is built but not deployed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    name: Is GitHub Pages enabled?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Query the Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null)"; then
            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is enabled with source: GitHub Actions."
              exit 0
            fi
            msg="GitHub Pages publishes from a branch (build_type: ${build_type:-unknown}). Set Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          else
            msg="GitHub Pages is not enabled for this repository. Enable it in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=GitHub Pages not deployed::$msg"
          {
            echo "### GitHub Pages not deployed"
            echo
            echo "$msg"
            echo
            echo "The site is still built (job **Build the site**) so that problems surface early."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the site
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      # actions/configure-pages reads the Pages configuration (GET /repos/{owner}/{repo}/pages), which
      # private and internal repositories refuse without this scope.
      pages: read
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          browsers: 'true'
          fonts: 'true'
          mdbook: 'true'

      - name: Cache trureturing frozen state
        uses: actions/cache@v5
        with:
          path: .cache/trureturing
          key: trureturing-state-${{ hashFiles('trureturing.lock.json') }}
          restore-keys: trureturing-state-

      - name: Configure Pages
        id: pages
        if: needs.probe.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Use the Pages URL for absolute links
        if: needs.probe.outputs.enabled == 'true' && steps.pages.outputs.base_url != ''
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # site.toml [site].base_url wins when set; otherwise use the real Pages URL (custom domains included).
          if python3 -c 'import sys, tomllib; sys.exit(1 if tomllib.load(open("site.toml", "rb")).get("site", {}).get("base_url") else 0)'; then
            echo "TBOOK_BASE_URL=${PAGES_URL%/}/" >> "$GITHUB_ENV"
            echo "base URL: ${PAGES_URL%/}/"
          fi

      - name: Check
        env:
          # check asks GitHub's compare API whether the pinned trureturing commit is on the site.toml branch
          # (no trureturing checkout here); in GitHub Actions an unanswered question is an error.
          GITHUB_TOKEN: ${{ github.token }}
          # Optional repository secret for a private trureturing (raw files and the compare API).
          TRURETURING_TOKEN: ${{ secrets.TRURETURING_TOKEN }}
        run: ./tbook check

      - name: Build everything
        run: ./tbook build all

      - name: Upload the Pages artifact
        if: needs.probe.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload the site as a workflow artifact
        if: needs.probe.outputs.enabled != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    name: Deploy
    needs: [probe, build]
    if: needs.probe.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
