name: film
# Build one book's film from source (theme/film/film.sh) and publish the videos as a GitHub Release.
# Trigger: push a tag film-<book slug>-<NNN>-v<k> equal to the film's film.json "release_tag"
# (e.g. film-example-monograph-001-v1), or run manually with the book and the film.
# The book embeds https://github.com/<repo>/releases/download/<release_tag>/<asset>, so the tag and the
# asset names (film.json "outputs") must not change after publishing; bump the version for a new cut.
on:
  push:
    tags: ['film-*']
  workflow_dispatch:
    inputs:
      book:
        description: 'Book slug (books/<slug>)'
        required: false
        default: 'example-monograph'
      film:
        description: 'Film directory <NNN>-<name>, or its number NNN'
        required: false
        default: '001'
      tag:
        description: 'Release tag film-<slug>-<NNN>-v<k> (default: release_tag from film.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: film-${{ github.event.inputs.tag || github.ref_name }}-${{ github.event.inputs.book }}-${{ github.event.inputs.film }}
  cancel-in-progress: false

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FILM_STRICT: '1'          # never publish provisional timing
      PYTHON: python
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Node packages (Playwright, @fontsource fonts)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: ffmpeg and fallback fonts for math glyphs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Resolve the film
        id: film
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_BOOK: ${{ github.event.inputs.book }}
          IN_FILM: ${{ github.event.inputs.film }}
          IN_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="$REF_NAME"
          elif [ -n "$IN_TAG" ]; then
            TAG="$IN_TAG"
          else
            TAG="$(python theme/film/release.py tag "$IN_BOOK" "$IN_FILM")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python theme/film/release.py resolve "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: .cache/film/models
          key: kokoro-onnx-model-files-v1.0

      - name: Setup (pip packages, Kokoro model)
        run: theme/film/film.sh "${{ steps.film.outputs.dir }}" setup

      - name: Narration, score, mixes, frames, masters, 720p
        run: theme/film/film.sh "${{ steps.film.outputs.dir }}" all

      - name: Release notes and files
        id: files
        env:
          DIR: ${{ steps.film.outputs.dir }}
        run: |
          set -euo pipefail
          python theme/film/release.py notes "$DIR" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          python theme/film/release.py assets "$DIR" > "$RUNNER_TEMP/assets.txt"
          cat "$RUNNER_TEMP/notes.md"
          {
            echo "paths<<EOF"
            cat "$RUNNER_TEMP/assets.txt"
            echo "$DIR/poster.jpg"
            echo "$DIR/out/timeline.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.film.outputs.tag }}
          path: ${{ steps.files.outputs.paths }}
          retention-days: 14
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.film.outputs.tag }}
          TITLE: ${{ steps.film.outputs.title }}
        run: |
          set -euo pipefail
          mapfile -t FILES < "$RUNNER_TEMP/assets.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" "${FILES[@]}"
          fi
