# 界面与排版用语（中文）。下游可在仓库根目录 i18n/zh.toml 中覆盖任意键。
[meta]
name = "中文"
bcp47 = "zh-CN"
# 书名页、封面、目录用的语言标签
short = "ZH"

[env]
theorem = "定理"
lemma = "引理"
proposition = "命题"
corollary = "推论"
definition = "定义"
conjecture = "猜想"
problem = "开放问题"
example = "例"
remark = "注"
proof = "证明"

[badge]
lean = "LEAN ✓"
open = "OPEN"
lean_title = "已在 trureturing 中由 Lean 内核验证并冻结"
open_title = "开放问题：尚无 Lean 证明"

[punct]
title_open = "（"
title_close = "）"
period = "。"
list_sep = "、"

[ui]
contents = "目录"
read_online = "在线阅读"
download = "下载"
pdf_screen = "PDF · 屏幕版"
pdf_print = "PDF · 印刷版"
epub = "EPUB · Apple Books"
slides = "演示文稿"
visualizations = "交互可视化"
films = "视频"
books = "书目"
version = "版本"
language = "语言"
back_to_library = "返回书库"
open_fullscreen = "全屏打开"
watch = "观看"
poster_unavailable = "视频海报未提供"
viz_static_note = "交互版本见"
