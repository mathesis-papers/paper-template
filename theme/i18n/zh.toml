title = "形式化验证账本"
intro = "本书每一条定理、引理、命题与推论都对应 trureturing 中一条已被 Lean 内核验证并冻结的声明。下表列出对应关系；链接固定到所钉的提交，内容不会随上游变化而漂移。"
