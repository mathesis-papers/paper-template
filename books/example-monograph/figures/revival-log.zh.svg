<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="revival-log" data-lang="zh" viewBox="0 0 520 300" width="520" height="300" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="对数纵轴，横轴 n 从 1 到 14。青色的点沿一条上升的直线排列，是等待时间 F_n；品红的点沿一条下降的直线排列，是误差 |F_nφ − F_{n+1}| = φ^{−n}，两条直线斜率相反。中间白色的点是两者之积，即回归得分，在绿色虚线 1/√5 两侧上下交替，越来越贴近它。">
<title>对数纵轴，横轴 n 从 1 到 14。青色的点沿一条上升的直线排列，是等待时间 F_n；品红的点沿一条下降的直线排列，是误差 |F_nφ − F_{n+1}| = φ^{−n}，两条直线斜率相反。中间白色的点是两者之积，即回归得分，在绿色虚线 1/√5 两侧上下交替，越来越贴近它。</title>
