<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="factor-skeleton" data-lang="en" viewBox="0 0 560 368" width="560" height="368" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="A proof skeleton. At the top a dashed box, &#x27;the golden word g&#x27;. First box: the number of a&#x27;s in a window equals ⌊(i+m+1)/φ⌋ − ⌊(i+1)/φ⌋, by goldenWindowTrueCount_eq_floor. Second box: that number depends only on which of the n+1 segments cut by n points the phase x_i falls in. Two branches follow: left, &#x27;at most n+1: one segment, one factor&#x27;; right, &#x27;at least n+1: the phases are dense, every segment is hit&#x27;. Both meet in the green LEAN ✓ box at the bottom, &#x27;exactly n+1 factors&#x27;, which is golden_factor_complexity.">
<title>A proof skeleton. At the top a dashed box, &#x27;the golden word g&#x27;. First box: the number of a&#x27;s in a window equals ⌊(i+m+1)/φ⌋ − ⌊(i+1)/φ⌋, by goldenWindowTrueCount_eq_floor. Second box: that number depends only on which of the n+1 segments cut by n points the phase x_i falls in. Two branches follow: left, &#x27;at most n+1: one segment, one factor&#x27;; right, &#x27;at least n+1: the phases are dense, every segment is hit&#x27;. Both meet in the green LEAN ✓ box at the bottom, &#x27;exactly n+1 factors&#x27;, which is golden_factor_complexity.</title>
